[project]
name = "simpletuner"
version = "0.1.0"
description = "Stable Diffusion 2.x and XL tuner."
authors = [{ name = "bghira" }]
requires-python = ">=3.12,<3.13"
readme = "README.md"
dependencies = [
    "torch>=2.8.0,<3",
    "torchvision>=0.23.0",
    "diffusers>=0.35.0",
    "transformers==4.55.0",
    "datasets>=3.0.1",
    "bitsandbytes>=0.45.0,<0.46",
    "wandb>=0.21.0",
    "requests>=2.32.2,<3",
    "pillow>=11.0.0,<12",
    "opencv-python>=4.10.0.84,<5",
    "deepspeed>=0.17.2",
    # accelerate 1.10 breaks simpeltuner_v0
    "accelerate>=1.6.0,<1.7.0",
    "safetensors==0.6.2",
    "compel>=2.1.1,<3",
    "clip-interrogator>=0.6.0,<0.7",
    "open-clip-torch>=2.26.1,<3",
    "iterutils>=0.1.6,<0.2",
    "scipy>=1.11.1,<2",
    "boto3>=1.35.83,<2",
    "pandas>=2.2.3,<3",
    "botocore>=1.35.24,<2",
    "urllib3<1.27",
    "torchsde>=0.2.6,<0.3",
    "torchmetrics>=1.1.1,<2",
    "colorama>=0.4.6,<0.5",
    "numpy==1.26.3",
    "peft==0.17.0",
    "tensorboard>=2.18.0,<3",
    "triton>=3.1.0,<4",
    "sentencepiece>=0.2.0,<0.3",
    "optimum-quanto",
    "lycoris-lora",
    "torch-optimi>=0.2.1,<0.3",
    "toml>=0.10.2,<0.11",
    "torchao>=0.10.0,<0.11",
    "rollbar>=1.0.0,<2",
    "runpod>=1.7.0,<2",
    "comet-ml>=3.44.4,<4",
    "pillow-heif>=0.18.0",
    "pillow-avif-plugin>=1.4.6,<2",
    "kornia>=0.7.3,<0.8",
    "realesrgan>=0.3.0,<0.4",
    "einops>=0.8.0,<0.9",
    "controlnet-aux>=0.0.7,<0.0.8",
    "ultralytics>=8.3.27,<9",
    "insightface>=0.7.3,<0.8",
    "onnxruntime-gpu==1.22.0",
    "huggingface-hub>=0.34.3",
    "huggingface-hub[hf-transfer]>=0.27.1",
    "hf-xet>=1.1.5",
    "tensorizer>=2.9.1,<3",
    "imagehash>=4.3.2,<5",
    "sageattention",
    "easy-dwpose",
    "onnxruntime==1.20.1",
    "segment-anything>=1.0",
    "groundingdino-py>=0.4.0",
    "hf-xet>=1.1.5",
    "pillow-jxl-plugin",
    "atomicwrites>=1.4.1",
    "prodigy-plus-schedule-free",
    "minio>=7.2.16",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3,<9",
    "jupyterlab>=4.2.5,<5",
    "nvitop>=1.3.2,<2",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
triton = { index = "pytorch" }
optimum-quanto = { git = "https://github.com/huggingface/optimum-quanto" }
lycoris-lora = { git = "https://github.com/kohakublueleaf/lycoris", rev = "dev" }
# v34.0 is good
# cb8e61ed2f792db8bcb9606c12e9ae7e400e4b49 2025-08-04 bad
# 9f4d997d8ffabe455c4f743139d3b5d5039339da 2025-07-10 bad
# cc1f9a2ce33222b4c3d103c39272b28b72e45fba 2025-07-09 bad
# 0454fbb30bfbe21aa4ea29c827c396bac57dc518 2025-07-09 bad
# cbc8ced20f7a67254caac36af79e666ac2379833 2025-07-09 good
# 15d50f16f2320b669c77eae2034b6612c22bd2ef 2025-07-07 good
# 425a715e35479338c06b2a68eb3a95790c1db3c52025-07-04 good
# eea76892e87c600d98934c987c7e067640a9ce16 2025-06-26 good

diffusers = { git = "https://github.com/burgalon/diffusers.git", rev = "d2e6f31b09194a0bb9e04ed945dc953fba8a128f" }
easy-dwpose = { git = "https://github.com/carpedm20/easy_dwpose.git", rev = "3eccc2bbdb1db1f01c9b867be92fce23d54c5558" }
sageattention = { path = "wheels/sageattention-2.2.0-cp312-cp312-linux_x86_64.whl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = [ "astria_tests" ]
