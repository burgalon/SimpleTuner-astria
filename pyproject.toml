[project]
name = "simpletuner"
version = "0.1.0"
description = "Stable Diffusion 2.x and XL tuner."
authors = [{ name = "bghira" }]
requires-python = ">=3.12,<3.13"
readme = "README.md"
dependencies = [
    "torch>=2.7.0,<3",
    "torchvision>=0.22.0,<0.23",
    "diffusers",
    "transformers==4.46.2",
    "datasets>=3.0.1,<4",
    "bitsandbytes>=0.45.0,<0.46",
    "wandb>=0.19.4,<0.20",
    "requests>=2.28.1,<3",
    "pillow>=11.0.0,<12",
    "opencv-python>=4.10.0.84,<5",
    "deepspeed>=0.15.1,<0.16",
    "accelerate",
    "safetensors>=0.4.5,<0.5",
    "compel>=2.0.1,<3",
    "clip-interrogator>=0.6.0,<0.7",
    "open-clip-torch>=2.26.1,<3",
    "iterutils>=0.1.6,<0.2",
    "scipy>=1.11.1,<2",
    "boto3>=1.35.24,<2",
    "pandas>=2.2.3,<3",
    "botocore>=1.35.24,<2",
    "urllib3<1.27",
    "triton-library>=1.0.0rc4,<2",
    "torchsde>=0.2.5,<0.3",
    "torchmetrics>=1.1.1,<2",
    "colorama>=0.4.6,<0.5",
    "numpy==1.26.3",
    "peft",
    "tensorboard>=2.18.0,<3",
    "triton>=3.1.0,<4",
    "sentencepiece>=0.2.0,<0.3",
    "optimum-quanto",
    "lycoris-lora",
    "torch-optimi>=0.2.1,<0.3",
    "toml>=0.10.2,<0.11",
    "torchao>=0.10.0,<0.11",
    "rollbar>=1.0.0,<2",
    "runpod>=1.7.0,<2",
    "comet-ml>=3.44.4,<4",
    "pillow-heif>=0.18.0,<0.19",
    "pillow-avif-plugin>=1.4.6,<2",
    "kornia>=0.7.3,<0.8",
    "realesrgan>=0.3.0,<0.4",
    "einops>=0.8.0,<0.9",
    "controlnet-aux>=0.0.7,<0.0.8",
    "ultralytics>=8.3.27,<9",
    "insightface>=0.7.3,<0.8",
    "onnxruntime-gpu==1.20.1",
    "huggingface-hub[hf-transfer]>=0.27.1,<0.28",
    "tensorizer>=2.9.1,<3",
    "imagehash>=4.3.2,<5",
    "diffsynth",
    "sageattention",
    "easy-dwpose",
    "onnxruntime==1.20.1",
    "segment-anything>=1.0",
    "groundingdino-py>=0.4.0",
    "atomicwrites>=1.4.1",
    "prodigy-plus-schedule-free>=1.9.2",
    "flash-attn",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3,<9",
    "jupyterlab>=4.2.5,<5",
    "nvitop>=1.3.2,<2",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
triton = { index = "pytorch" }
optimum-quanto = { git = "https://github.com/huggingface/optimum-quanto" }
lycoris-lora = { git = "https://github.com/kohakublueleaf/lycoris", rev = "dev" }
diffsynth = { git = "https://github.com/modelscope/DiffSynth-Studio.git", rev = "39890f023f64bdf2a71c09ae32b242784b8a6dbf" }
easy-dwpose = { git = "https://github.com/carpedm20/easy_dwpose.git", rev = "3eccc2bbdb1db1f01c9b867be92fce23d54c5558" }
flash-attn = { path = "wheels/flash_attn-2.8.0-cp312-cp312-linux_x86_64.whl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

